# Platform alerts: Kubernetes, Jenkins, and the monitoring system itself. Application alerts live in
# charts/voteball, next to the application they describe.
#
# EVERY RULE HERE REPLACES A kube-prometheus-stack DEFAULT, which terraform/addon-monitoring.tf
# switches off by name. One rule per condition: two emails about one problem trains the reader to
# stop opening them, which costs more than the second rule adds.
#
# These are deliberately CLUSTER-WIDE, matching the scope of the defaults they replace. A rule scoped
# to one namespace cannot replace a cluster-wide default without silently dropping coverage of every
# other namespace.
{{- if .Values.alerts.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-alerts
  namespace: {{ .Release.Namespace }}
  labels:
    # REQUIRED. Without it Prometheus never evaluates this object, while `kubectl get prometheusrules`
    # still lists it looking perfectly correct.
    release: kube-prometheus-stack
    {{- include "observability.labels" . | nindent 4 }}
spec:
  groups:
    - name: platform.kubernetes
      rules:
        - alert: NodeNotReadyOrUnderPressure
          # Replaces KubeNodeNotReady, KubeNodeUnreachable AND KubeNodePressure (all three disabled in
          # terraform/addon-monitoring.tf) -- the condition set below has to match KubeNodePressure's
          # (MemoryPressure|DiskPressure|PIDPressure) exactly, or disabling that default drops
          # PIDPressure coverage silently: Alertmanager's inhibit rules key on `equal: [namespace,
          # alertname]`, so a differently-named rule never inhibits this one and losing the condition
          # here isn't masked by anything, it's just gone. The node group is 100% Spot, so a node
          # going away is routine -- 10m of NotReady is not.
          expr: |
            kube_node_status_condition{condition="Ready", status="true"} == 0
            or kube_node_status_condition{condition=~"MemoryPressure|DiskPressure|PIDPressure", status="true"} == 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ `{{ $labels.node }}` }} is not Ready or is under resource pressure"
            description: "On a 100% Spot node group a brief NotReady is normal; ten minutes is not. Check whether the Cluster Autoscaler has replaced it."
            runbook_url: "https://github.com/Latnook/voteball/blob/master/docs/runbooks/NodeNotReadyOrUnderPressure.md"

        - alert: DeploymentReplicasMismatch
          # Replaces KubeDeploymentReplicasMismatch. Cluster-wide on purpose -- this moved here from
          # charts/voteball, where it covered only devops-app and could not have replaced the default
          # without dropping ci, argocd and observability.
          #
          # The default it replaces is
          # `(spec_replicas > status_replicas_available) and (changes(status_replicas_updated[10m]) == 0)`
          # for 15m -- both clauses matter, and a bare `ready < spec` drops them. On this two-node
          # 100%-Spot group an HPA scale-up where Cluster Autoscaler takes 10+ minutes to add capacity
          # is a HEALTHY, still-progressing rollout, and `ready` (readiness-probe-gated) lags
          # `available` (ready AND stable past minReadySeconds) further still -- so the bare form pages
          # on ordinary autoscaling. The `changes(...updated[10m]) == 0` clause is what actually
          # encodes "stalled": the updated-replica count stops moving only when the rollout has
          # genuinely stopped progressing, not merely when it hasn't finished yet. The runbook here
          # tells the reader to look for a stalled rollout, so the rule now means that.
          expr: |
            (kube_deployment_status_replicas_available
              < kube_deployment_spec_replicas)
            and (changes(kube_deployment_status_replicas_updated[10m]) == 0)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Deployment {{ `{{ $labels.namespace }}` }}/{{ `{{ $labels.deployment }}` }} is short of replicas"
            description: "Ready replicas below desired for 10 minutes. A rollout that never completed looks exactly like this."
            runbook_url: "https://github.com/Latnook/voteball/blob/master/docs/runbooks/DeploymentReplicasMismatch.md"

    - name: platform.monitoring
      rules:
        - alert: PrometheusTargetDown
          # Replaces the default TargetDown. Cluster-wide, matching it: a scrape target being down is
          # how you learn the metrics you are about to trust are missing.
          expr: up == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Scrape target {{ `{{ $labels.job }}` }} in {{ `{{ $labels.namespace }}` }} is down"
            description: "Prometheus cannot reach this target. Any dashboard or alert built on its metrics is now blind rather than green."
            runbook_url: "https://github.com/Latnook/voteball/blob/master/docs/runbooks/PrometheusTargetDown.md"

    - name: platform.jenkins
      rules:
        - alert: JenkinsQueueStuck
          # Verified live against this cluster's /api/v1/label/__name__/values on 2026-08-18: the
          # plan's guessed default (default_jenkins_queue_size_value) does not exist under either
          # metric family. jenkins_queue_size_value (bundled Metrics-plugin registry) is used here
          # because it states the alert's intent directly -- builds queued with nothing draining
          # them -- and its siblings (jenkins_queue_blocked_value, jenkins_queue_buildable_value,
          # jenkins_queue_pending_value, jenkins_queue_stuck_value) give a natural escalation path
          # later. jenkins_queue_stuck_value is Jenkins' own narrower notion of "stuck" -- a task
          # that cannot be scheduled at all -- and is worth switching to if this 15-minute window
          # proves noisy, but it would miss a queue that is merely draining too slowly.
          expr: {{ .Values.jenkins.queueMetric }} > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Jenkins build queue has been non-empty for 15 minutes"
            description: "Builds are queued with nothing draining them. Usually no agent can be scheduled; the website is unaffected."
            runbook_url: "https://github.com/Latnook/voteball/blob/master/docs/runbooks/JenkinsQueueStuck.md"

    - name: platform.logging
      rules:
        # The EFK pipeline. Deliberately NOT alerting on Elasticsearch cluster health being `yellow`:
        # this is a single-node cluster with no replica shard by design (see
        # docs/design/2026-08-27-efk-logging-design.md decision 3), so yellow is its permanent, correct
        # state. An alert that fires forever is one people learn to ignore -- the same reasoning
        # recorded at VoteballJourneyTrafficStopped in charts/voteball.
        # BOTH OF THESE CARRY an `or absent(...)`, and it is not decoration. A bare `== 0` on a
        # kube-state-metrics series is blind to the most likely way this stack breaks: the series
        # VANISHES when the workload is deleted. A `kubectl delete elasticsearch`, an ArgoCD prune, a
        # chart change that stops rendering the object, or the whole `logging` Application being
        # removed all take the metric away entirely -- and a comparison against a series that does not
        # exist matches nothing, so no data means no alert. The absent() half turns "the workload is
        # gone" into a firing alert instead of silence, which is the same defect shape as
        # VoteballSLIAbsent ("we can no longer tell" is not "everything is fine").
        #
        # `absent()` rather than `or on() vector(0)`: the vector form returns its fallback whenever the
        # left side is empty, and `X == 0` is empty in the HEALTHY case too, so it would fire
        # permanently. absent() is empty whenever the series exists at all.
        #
        # `for: 15m` covers the benign disappearances -- a Spot reclaim, a rescheduled pod, a rolling
        # update. A deliberate teardown will fire these; that is correct, and the runbooks say so.
        - alert: ElasticsearchDown
          expr: >-
            kube_pod_status_ready{namespace="logging", condition="true", pod=~"voteball-logs-es-.*"} == 0
            or absent(kube_pod_status_ready{namespace="logging", condition="true", pod=~"voteball-logs-es-.*"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Elasticsearch is not Ready in the logging namespace"
            description: "Log search is unavailable, or the Elasticsearch resource no longer exists at all. CloudWatch still holds the authoritative copy, so this is not a loss of logs."
            runbook_url: "https://github.com/Latnook/voteball/blob/master/docs/runbooks/ElasticsearchDown.md"
        - alert: FluentdDown
          expr: >-
            kube_deployment_status_replicas_available{namespace="logging", deployment="fluentd"} == 0
            or absent(kube_deployment_status_replicas_available{namespace="logging", deployment="fluentd"})
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "The Fluentd aggregator has no available replica"
            description: "Fluent Bit is buffering and retrying silently, or the Fluentd Deployment no longer exists at all; logs are not reaching Elasticsearch. CloudWatch is unaffected."
            runbook_url: "https://github.com/Latnook/voteball/blob/master/docs/runbooks/FluentdDown.md"
{{- end }}
