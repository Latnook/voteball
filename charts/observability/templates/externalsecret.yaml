# Grafana data source credentials, synced from Secrets Manager by External Secrets Operator.
#
# A SecretStore per namespace, matching charts/voteball: ESO authenticates with the CONTROLLER's
# IRSA, whose policy is an explicit ARN allowlist in terraform/addon-eso.tf. If voteball/grafana is
# missing from that list this resource reports SecretSyncedError while Grafana boots normally with
# an EMPTY password -- the failure surfaces when a panel loads, not at deploy time.
#
# apiVersion v1: ESO 2.8.0 serves external-secrets.io/v1 (v1beta1 is no longer served).
{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecret.region | quote }}
{{- end }}
---
# TWO independent ExternalSecrets, not one carrying both keys. ESO fails an ExternalSecret's ENTIRE
# sync if any one of its `data` entries cannot be resolved -- and the GitHub token is optional by
# design (docs/design/2026-08-24-grafana-datasources-design.md decision 5: "no alert, no SLI and no
# incident path depends on" it; scripts/seed-grafana-secret.sh skips it rather than prompting or
# failing when nobody supplies one). A single two-key resource would take the PostgreSQL data source
# down along with the GitHub one on exactly that -- normal, unattended -- deploy. Splitting them, and
# gating each independently (dbEnabled / githubEnabled), makes the two credentials genuinely
# independent instead of coupled by a shared ExternalSecret. Each targets its OWN Secret name so
# terraform's grafana.envFromSecrets (a list, each entry `optional = true`) can project both without
# either becoming a hard dependency of the other.
{{- if and .Values.externalSecret.enabled .Values.externalSecret.dbEnabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-datasource-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: grafana-datasources   # projected into the Grafana pod by grafana.envFromSecrets[0]
    creationPolicy: Owner
    deletionPolicy: Retain      # ESO default -- stated explicitly so ArgoCD stays Synced
  # Named keys rather than dataFrom/extract: the environment variable name is a contract with the
  # provisioning files in templates/datasources.yaml, and a rename on either side must not silently
  # produce an empty string. Spelling it out here makes the contract greppable.
  data:
    - secretKey: GF_DATASOURCE_DB_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.secretName | quote }}
        property: db_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
---
{{- if and .Values.externalSecret.enabled .Values.externalSecret.githubEnabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-datasource-github
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "observability.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: grafana-datasources-github   # projected into the Grafana pod by grafana.envFromSecrets[1]
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GF_DATASOURCE_GITHUB_TOKEN
      remoteRef:
        key: {{ .Values.externalSecret.secretName | quote }}
        property: github_token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
