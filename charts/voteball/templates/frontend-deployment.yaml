apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: frontend
    {{- include "voteball.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
      annotations:
        # The amazon-cloudwatch-observability addon's mutating webhook injects an OTel agent per
        # language into every pod by default. frontend is nginx, no runtime any of these agents
        # attach to -- opt out of all four explicitly.
        instrumentation.opentelemetry.io/inject-java: "false"
        instrumentation.opentelemetry.io/inject-python: "false"
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
    spec:
      serviceAccountName: frontend
      # Graceful drain for the ALB (target-type ip): on termination, keep serving for a few seconds
      # while the ALB deregisters this pod's IP, so in-flight/just-routed requests don't hit a dead
      # pod (the transient 502 otherwise seen on a pod restart).
      terminationGracePeriodSeconds: 30
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: frontend }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: frontend
          image: {{ include "voteball.image" (dict "root" $ "name" "nginx") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 15"]
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: {{ .Values.frontend.resources.requests.cpu }}, memory: {{ .Values.frontend.resources.requests.memory }} }
            limits: { cpu: {{ .Values.frontend.resources.limits.cpu }}, memory: {{ .Values.frontend.resources.limits.memory }} }
          startupProbe:
            # Owns the boot window: while this is pending, the two probes below do not run at all and
            # the container is NotReady. nginx serves static files and has no dependencies, so the real
            # boot is ~1s; budget = failureThreshold * periodSeconds = 30s is pure headroom for a
            # throttled Spot node. Probes target `/`, never `/health` -- nginx proxies only `/api/*`,
            # so `/health` 404s here (the same reason scripts/ci/smoke-test.sh skips it).
            httpGet: { path: /, port: 8080 }
            periodSeconds: 3
            failureThreshold: 10
          readinessProbe:
            # No initialDelaySeconds: the startup probe above already owns boot and this is not
            # scheduled until it passes.
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            # Weaker check than readiness on purpose: readiness going false only removes this pod from
            # the Service, liveness going false KILLS the container.
            tcpSocket: { port: 8080 }
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 101 # nginx-unprivileged
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: cache, mountPath: /var/cache/nginx }
        - name: exporter
          image: {{ .Values.frontend.exporter.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --nginx.scrape-uri=http://127.0.0.1:8081/stub_status
          ports:
            - name: metrics
              containerPort: 9113
          resources:
            requests: { cpu: {{ .Values.frontend.exporter.resources.requests.cpu }}, memory: {{ .Values.frontend.exporter.resources.requests.memory }} }
            limits: { cpu: {{ .Values.frontend.exporter.resources.limits.cpu }}, memory: {{ .Values.frontend.exporter.resources.limits.memory }} }
          securityContext:
            # Same posture as every other container in this namespace. The exporter needs no
            # privileges at all -- it makes one loopback HTTP request and serves one endpoint.
            runAsNonRoot: true
            runAsUser: 101
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: cache, emptyDir: {} }
