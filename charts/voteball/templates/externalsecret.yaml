# SecretStore: ESO talks to Secrets Manager using the ESO controller's IRSA (scoped to this secret
# in Plan 2b). ExternalSecret materializes the K8s Secret app-secret that backend/worker envFrom.
# apiVersion v1: ESO 2.8.0 serves external-secrets.io/v1 (v1beta1 is no longer served).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.config.AWS_REGION | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: app-secret        # the K8s Secret backend/worker read via envFrom
    creationPolicy: Owner
    deletionPolicy: Retain  # ESO default -- stated explicitly so ArgoCD stays Synced (no controller drift)
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.secretName | quote }}
        # ESO defaults -- pinned so ArgoCD's rendered manifest matches the live (defaulted) resource.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# The grafana_ro Postgres password, for the migrate Job's ALTER ROLE (services/backend/migrate.py).
#
# A SEPARATE ExternalSecret rather than another key in app-secret: this namespace has no business
# holding the GitHub token that sits in the same Secrets Manager container, and `data` with a named
# property is what keeps the two apart. Kept out of app-secret so backend/worker do not gain a
# credential they never use.
#
# GATED OFF BY DEFAULT, and the gate is not optional. This ExternalSecret is CHART code, which
# reaches the cluster on a git push via application-cd. The Secrets Manager container it reads is
# TERRAFORM code, which reaches AWS only on a billed `terraform apply`. Those two halves travel at
# different speeds, so shipping this ungated put a consumer in the cluster before its producer
# existed: ESO reported SecretSyncedError, the resource went Degraded, ArgoCD's sync operation
# reported phase Failed, and because anything failing after Promote triggers a rollback, EVERY CD
# run became "deploy fails -> roll production back". Observed live 2026-08-24, twice
# (application-cd #4 and #6, both rolling back to 2356172).
#
# Flip this to true only AFTER `terraform apply` has created voteball/grafana AND
# scripts/seed-grafana-secret.sh has put a real db_password in it. See
# docs/design/2026-08-24-grafana-datasources-design.md.
{{- if .Values.externalSecret.grafanaEnabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: grafana-db-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GRAFANA_DB_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.grafanaSecretName | quote }}
        property: db_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
{{- end }}
