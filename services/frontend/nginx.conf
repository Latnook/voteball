# EKS: ALB terminates TLS and forwards plain HTTP here on 8080. No 80->443 redirect (the ALB does
# HTTP->HTTPS), no ssl_certificate. nginx-unprivileged listens on 8080 as uid 101.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Absolute URLs for SEO (canonical, og:url, og:image, the Sitemap: line in robots.txt, and the
    # sitemap's own <loc> entries) are written as the literal __SITE_URL__ and rewritten here from
    # the request's own Host header. The domain is therefore hardcoded nowhere in the repo, per the
    # forkability rule in CLAUDE.md -- a rebuild onto a new domain needs no code change.
    #
    # Scheme is fixed to https because the ALB redirects :80 -> :443 before anything reaches this
    # pod, so $scheme (always "http" here, TLS having been terminated upstream) would be wrong.
    #
    # application/json is deliberately NOT in the types list: /api/ responses must never be rewritten.
    sub_filter_types text/xml application/xml text/plain;
    sub_filter __SITE_URL__ "https://$host";
    sub_filter_once off;

    # Serve "/" directly (no `index` directive) so it can't rewrite to /index.html and loop.
    location = / {
        try_files /index.html =404;
    }

    location = /index.html { return 301 /; }
    location = /results.html { return 301 /results; }
    location = /admin.html { return 301 /admin; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # In-cluster DNS: "backend" resolves to the backend Service in the same namespace.
    # >>> ROLLBACK DRILL 2026-08-23 -- DELIBERATELY BROKEN, REVERTED IN THE NEXT COMMIT <<<
    # Returns 503 for /api/options ONLY. Chosen so the pods stay READY (the readiness probe hits
    # `/`, which is untouched) and the ArgoCD rollout therefore SUCCEEDS -- which puts the failure
    # exactly where the drill wants it: the CD Smoke Test, the only check in the whole pipeline that
    # asks the product whether it works rather than whether pods are Healthy.
    location = /api/options { return 503; }

    location /api/ {
        # Crawlable, but never a search result in its own right. robots.txt deliberately allows
        # /api/options and /api/results so Googlebot can execute the page's JavaScript and see the
        # rendered content; this header is what stops the raw JSON being indexed as a document.
        # Blocking the crawl instead would leave /results rendering as an empty shell.
        add_header X-Robots-Tag "noindex, nofollow" always;

        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}

# Metrics-only listener for the nginx-prometheus-exporter sidecar (see the frontend Deployment).
# Separate server block on its own port, never on 8080: the ALB forwards to 8080, so a /stub_status
# location there would be reachable from the internet. This one accepts only loopback, which in a
# pod means only a container in the SAME pod -- the exporter sidecar and nothing else.
server {
    listen 127.0.0.1:8081;
    server_name _;

    location = /stub_status {
        stub_status;
        access_log off;
    }

    location / { return 404; }
}
