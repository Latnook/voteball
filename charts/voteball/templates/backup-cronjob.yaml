# Nightly pg_dump -> S3 backups/. Uses the backup SA (IRSA -> S3 backups/* only, no SNS). Per the
# PDF's CronJob best practices: Forbid overlap, bounded history, restartPolicy Never.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: voteball-backup
  namespace: {{ .Release.Namespace }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          # MUST be `backup`, matching the `allow-db-egress` and `allow-aws-api-egress`
          # NetworkPolicies' `app In (...)` lists (one policy, `allow-app-egress`, until 2026-08-23) --
          # NOT `voteball-backup` (the CronJob/Job/image name). A pod outside that list keeps only
          # `allow-dns-egress`, so DNS resolves and every TCP connection is dropped: pg_dump to RDS
          # and the aws-cli's STS call both time out. The VPC CNI runs NETWORK_POLICY_ENFORCING_MODE
          # `standard`, which fails OPEN for the first seconds of a pod's life, so this hid for days
          # as a flaky job -- pg_dump beat the policy agent, aws-cli's slower Python startup did not.
          labels: { app: backup }
          annotations:
            # The amazon-cloudwatch-observability addon's mutating webhook injects an OTel agent per
            # language into every pod by default. This is a short-lived pg_dump job -- an injected
            # agent only adds startup latency and an extra image pull. Opt out of all four explicitly.
            instrumentation.opentelemetry.io/inject-java: "false"
            instrumentation.opentelemetry.io/inject-python: "false"
            instrumentation.opentelemetry.io/inject-nodejs: "false"
            instrumentation.opentelemetry.io/inject-dotnet: "false"
        spec:
          serviceAccountName: backup
          restartPolicy: Never
          containers:
            - name: backup
              image: {{ include "voteball.image" (dict "root" $ "name" "backup") | quote }}
              env:
                # aws-cli writes ~/.aws (config/cache); under readOnlyRootFilesystem, point HOME at
                # the writable /tmp emptyDir or it fails with "Read-only file system: '/.aws'".
                - { name: HOME, value: /tmp }
              envFrom:
                - configMapRef: { name: app-config }   # DB_HOST/NAME/USER, S3_BUCKET
                - secretRef: { name: app-secret }      # DB_PASS
              securityContext:
                runAsNonRoot: true
                runAsUser: 1000
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: tmp
              # backup.sh stages the gzipped dump here before uploading, so this is no longer just
              # aws-cli's HOME. sizeLimit caps it: without one, a dump that outgrows the node's
              # ephemeral storage evicts unrelated pods on that node instead of failing this Job.
              # Exceeding it evicts only this pod, which is a loud, contained failure.
              emptyDir: { sizeLimit: 2Gi }
