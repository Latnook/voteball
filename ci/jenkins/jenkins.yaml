# Jenkins Configuration as Code -- the whole of this host's configuration, in git.
#
# Applied at every Jenkins startup, so this file is the source of truth and the UI is a view of it.
# Anything changed by clicking in the UI is lost on the next restart; change it here instead.
#
# WHY: before 2026-07-21 this configuration existed only on one EBS volume, built by hand through
# the UI following a 12-step runbook in docs/cicd.md. Losing the host meant redoing all of it, and
# the deploy key could not be redone at all -- its only copy was in Jenkins' own credential store.
#
# NOTHING SECRET IS IN THIS FILE. Every ${PLACEHOLDER} is resolved at boot from the environment,
# which is projected from the `jenkins-secret` Kubernetes Secret -- synced from AWS Secrets Manager
# (voteball/jenkins) by External Secrets Operator. A missing variable makes JCasC fail loudly at
# startup rather than silently configuring nothing.
#
# Identity (${GITHUB_REPO}, ${AWS_REGION}, ${CLUSTER_NAME}) is injected the same way, from Terraform
# variables -- the repo's forkability rule applies here as everywhere: fork it, set your own tfvars,
# and this file is unchanged.

jenkins:
  systemMessage: "Voteball CI. Configured by JCasC from ci/jenkins/jenkins.yaml -- UI edits do not survive a restart."
  # The controller must not build; agents do. Builds run in ephemeral pod agents provisioned by the
  # Kubernetes cloud below.
  numExecutors: 0
  mode: NORMAL
  quietPeriod: 5

  securityRealm:
    local:
      # No self-registration: the only account is the operator's, created below.
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          # The BCRYPT HASH, not a password -- JCasC accepts a "#jbcrypt:$2a$..." value directly, so
          # the plaintext admin password never has to exist in Secrets Manager, in git, or here.
          password: "${JENKINS_ADMIN_HASH}"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      # The UI is reachable only via `kubectl port-forward -n ci svc/jenkins 8080:8080` -- the ALB
      # exposes just the /github-webhook path, not the UI -- but anonymous read would still expose
      # it to anyone who can reach that port-forward.
      allowAnonymousRead: false

  # crumbIssuer is deliberately ABSENT. Jenkins installs DefaultCrumbIssuer itself, which is what the
  # hand-built config.xml had (`<crumbIssuer class="...DefaultCrumbIssuer"/>`, no children). An
  # earlier draft set `standard: { excludeClientIPFromCrumb: false }` and Jenkins 2.568.1 refused to
  # boot: that attribute does not exist on this version. Configuring a default to its own default is
  # how you acquire a version-coupled field for nothing.

  globalNodeProperties:
    - envVars:
        env:
          # The direct equivalent of the retired GitHub Actions repo variables. The Jenkinsfile fails
          # fast if either is unset rather than building "null.dkr.ecr.null.amazonaws.com".
          - key: "AWS_REGION"
            value: "${AWS_REGION}"
          - key: "CLUSTER_NAME"
            value: "${CLUSTER_NAME}"

  clouds:
    - kubernetes:
        name: "kubernetes"
        serverUrl: "https://kubernetes.default.svc"
        namespace: "ci"
        jenkinsUrl: "http://jenkins.ci.svc.cluster.local:8080"
        jenkinsTunnel: "jenkins-agent.ci.svc.cluster.local:50000"
        directConnection: false
        # Bounded so a wedged agent cannot hold the queue forever.
        containerCapStr: "3"
        retentionTimeout: 5
        connectTimeout: 60
        readTimeout: 60
        templates:
          - name: "voteball-build"
            label: "voteball-build"
            # RAW POD YAML, NOT the typed `containers:` list. That list cannot express
            # securityContext, so the typed form would silently drop
            # allowPrivilegeEscalation:false and capabilities.drop:[ALL] from every container and
            # still start successfully -- the failure mode being avoided is a green build on
            # containers that quietly hold more privilege than the cluster's own rules allow.
            yamlMergeStrategy: override
            yaml: |
              apiVersion: v1
              kind: Pod
              spec:
                serviceAccountName: jenkins
                securityContext:
                  runAsNonRoot: true
                  runAsUser: 1000
                containers:
                  # Rootless BuildKit. NOT privileged, and not Docker-in-Docker: a privileged pod
                  # would be the weakest point in a cluster whose every app container sets
                  # allowPrivilegeEscalation:false. --oci-worker-no-process-sandbox is required
                  # for rootless operation on Kubernetes.
                  - name: buildkit
                    image: moby/buildkit:v0.19.0-rootless
                    args:
                      - --addr=unix:///run/user/1000/buildkit/buildkitd.sock
                      - --oci-worker-no-process-sandbox
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities: { drop: ["ALL"] }
                      runAsUser: 1000
                      seccompProfile: { type: Unconfined }
                    resources:
                      requests: { cpu: "500m", memory: "2Gi" }
                      limits: { memory: "3Gi" }
                    volumeMounts:
                      - { name: images, mountPath: /images }
                  - name: trivy
                    image: aquasec/trivy:0.58.1
                    command: ["cat"]
                    tty: true
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities: { drop: ["ALL"] }
                    volumeMounts:
                      - { name: images, mountPath: /images }
                  - name: skopeo
                    image: quay.io/skopeo/stable:v1.17.0
                    command: ["cat"]
                    tty: true
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities: { drop: ["ALL"] }
                    volumeMounts:
                      - { name: images, mountPath: /images }
                  - name: awscli
                    image: amazon/aws-cli:2.22.0
                    command: ["cat"]
                    tty: true
                    securityContext:
                      allowPrivilegeEscalation: false
                      capabilities: { drop: ["ALL"] }
                    volumeMounts:
                      - { name: images, mountPath: /images }
                volumes:
                  # Tarballs only. There is deliberately NO cache volume -- both caches live in
                  # ECR, because a pod volume dies with the build and would be a cache in name
                  # only. See the design doc section 5a.
                  - name: images
                    emptyDir: { sizeLimit: 8Gi }

credentials:
  system:
    domainCredentials:
      - credentials:
          # The repo deploy key (write access), used by sshagent() for the tag-bump push -- G4.
          - basicSSHUserPrivateKey:
              scope: GLOBAL
              id: "voteball-deploy-key"
              username: "${GITHUB_DEPLOY_USER}"
              description: "Deploy key for ${GITHUB_REPO} (managed by JCasC)"
              privateKeySource:
                directEntry:
                  # MUST retain its trailing newline. A key without one cannot be loaded by OpenSSH
                  # at all, and the resulting error is "Permission denied (publickey)", which reads
                  # like an authorisation problem and is not -- see docs/cicd.md failure modes.
                  privateKey: "${GITHUB_DEPLOY_KEY}"

          # Shared secret GitHub signs webhook deliveries with.
          - string:
              scope: GLOBAL
              id: "github-webhook-secret"
              description: "GitHub webhook shared secret (managed by JCasC)"
              secret: "${GITHUB_WEBHOOK_SECRET}"

unclassified:
  location:
    # Must be the real external URL now: the GitHub plugin builds the webhook URL from it, and the
    # chart -- not an SSH tunnel -- is what makes this host reachable at all.
    url: "https://jenkins.${APP_DOMAIN}/"
    # adminAddress is deliberately omitted: it only appears in outgoing mail, and this host has no
    # SMTP (G7). Setting it would imply notifications that do not exist.

jobs:
  # Job DSL. The job is deliberately thin: everything about HOW to build lives in the Jenkinsfile,
  # in the repository. This block only says where to find it and when to run it.
  - script: |
      pipelineJob('voteball') {
        description('Voteball CI. Definition lives in the Jenkinsfile; this job is managed by JCasC.')

        properties {
          githubProjectUrl('https://github.com/${GITHUB_REPO}/')
        }

        parameters {
          booleanParam('FORCE_BUILD', false, 'Build even if this commit touches no files under services/')
        }

        // G5: four images per build on a persistent host fills the disk.
        logRotator {
          numToKeep(20)
        }

        triggers {
          githubPush()
        }

        definition {
          cpsScm {
            scm {
              git {
                remote {
                  // MUST be the SSH remote. sshagent() only affects SSH remotes -- with an HTTPS
                  // URL the deploy key is silently ignored and the final push fails after a
                  // successful build. This is failure mode 1 in docs/cicd.md.
                  url('git@github.com:${GITHUB_REPO}.git')
                  credentials('voteball-deploy-key')
                }
                branch('*/master')
              }
            }
            scriptPath('Jenkinsfile')
            lightweight(true)
          }
        }
      }
