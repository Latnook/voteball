apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: frontend
    {{- include "voteball.labels" . | nindent 4 }}
spec:
  type: ClusterIP # the ALB Ingress (Plan 3b) fronts this; no direct LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
    # The nginx exporter sidecar. Named because a ServiceMonitor selects an endpoint by Service port
    # NAME, never by number.
    - name: metrics
      port: 9113
      targetPort: 9113
