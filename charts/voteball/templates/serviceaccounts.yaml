# frontend + backend: NO IRSA role (least privilege -- they never call AWS APIs).
#
# automountServiceAccountToken: false on BOTH -- neither service makes a single Kubernetes API call,
# so the projected `kube-api-access-*` volume kubelet mounts by default is a credential sitting in a
# pod that has no use for it. The 2026-08-23 review found it in a captured backend pod. It is not
# nothing: the frontend is the one workload the public internet can reach, and a token that grants
# even `get pods` turns a container escape or an SSRF into cluster reconnaissance.
#
# Setting it on the ServiceAccount rather than each pod spec is deliberate -- it then covers every
# pod that ever uses the account, including the migrate Job (which runs as `backend`) and anything
# added later, instead of relying on whoever writes the next Deployment to remember.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
# worker + backup: NOT given automountServiceAccountToken: false, and that is a considered choice,
# not an oversight. Neither calls the Kubernetes API either, so on the merits they qualify -- but
# these are the only two workloads carrying an AWS role, so they are the two where a mistake costs
# the most. IRSA does not in fact depend on the default mount (the EKS pod identity webhook injects
# its own `aws-iam-token` projected volume with the sts.amazonaws.com audience, which is a separate
# volume that this field does not govern), so turning it off here SHOULD be safe -- but "should be"
# is not "verified against a live cluster", and the failure mode is a worker that cannot publish to
# SNS or write snapshots. Revisit with a drill that proves IRSA still works with the mount off.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.worker.roleArn | quote }}
---
# backup CronJob: its OWN IRSA role (S3 backups/ prefix only) -- separate from worker's snapshots/.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup
  namespace: {{ .Release.Namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.backup.roleArn | quote }}
