apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: backend
    {{- include "voteball.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    # Named because a ServiceMonitor selects an endpoint by Service port NAME, never by number.
    - name: http
      port: 5000
      targetPort: 5000
