apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    app: backend
    {{- include "voteball.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels: { app: backend }
  template:
    metadata:
      labels: { app: backend }
      annotations:
        # The amazon-cloudwatch-observability addon's mutating webhook injects an OTel agent per
        # language into every pod by default. All four are off (so a future addon default can't flip
        # one back on silently). Python was "true" until 2026-08-03: this pod's traces were the sole
        # source of ~89k X-Ray traces/month, and Application Signals is now disabled add-on-wide in
        # terraform/addon-cloudwatch.tf. Setting this back to "true" alone does nothing -- and if
        # Application Signals is ever re-enabled, it silently resumes billing traces.
        instrumentation.opentelemetry.io/inject-java: "false"
        instrumentation.opentelemetry.io/inject-python: "false"
        instrumentation.opentelemetry.io/inject-nodejs: "false"
        instrumentation.opentelemetry.io/inject-dotnet: "false"
    spec:
      serviceAccountName: backend
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app: backend }
                topologyKey: kubernetes.io/hostname
      containers:
        - name: backend
          image: {{ include "voteball.image" (dict "root" $ "name" "backend") | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef: { name: app-config }
            - secretRef: { name: app-secret }
          env:
            # NOT in the app-config ConfigMap, deliberately. migrate-job.yaml consumes that ConfigMap
            # via envFrom and runs readOnlyRootFilesystem with no writable /tmp, so a multiproc dir
            # set there would reach the migration Job -- the hook that gates every release.
            - name: PROMETHEUS_MULTIPROC_DIR
              value: /tmp/prom
            # gunicorn runs 2 workers per pod, each with its own counters. Without the directory
            # above, /metrics is answered by whichever worker accepts the connection, so the counter
            # alternates between two independent series -- non-monotonic, which rate() reads as
            # repeated counter resets and turns into meaningless spikes. Nothing fails loudly if this
            # is removed; see docs/design/2026-08-17-observability-design.md section 4.
            - name: APP_VERSION
              value: {{ .Values.image.tag | quote }}
          resources:
            requests: { cpu: {{ .Values.backend.resources.requests.cpu }}, memory: {{ .Values.backend.resources.requests.memory }} }
            limits: { cpu: {{ .Values.backend.resources.limits.cpu }}, memory: {{ .Values.backend.resources.limits.memory }} }
          startupProbe:
            # Owns the boot window: while this is pending, the two probes below do not run at all and
            # the container is NotReady. gunicorn does NOT serve immediately -- gunicorn.conf.py's
            # on_starting hook runs db.init_db() (schema.sql + seed.sql, 61 statements) in the master
            # before it binds the listener, so nothing answers on :5000 until that finishes. Against a
            # cold RDS just restored from a snapshot that is the slowest thing this container does.
            # Budget = failureThreshold * periodSeconds = 60s, and it is a hard wall: exceed it and the
            # kubelet kills the container, with 10s..5min backoff on each retry. Sized generously on
            # purpose -- overshooting only delays a rollout, undershooting is a crash loop.
            httpGet: { path: /health, port: 5000 }
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            # /health is a static JSON response and touches no database (app.py), so this asserts
            # "gunicorn is serving", not "RDS is reachable" -- deliberately, per the liveness note below.
            # No initialDelaySeconds: the startup probe above already owns boot and this is not
            # scheduled until it passes.
            httpGet: { path: /health, port: 5000 }
            periodSeconds: 10
          livenessProbe:
            # Weaker check than readiness on purpose: readiness going false only removes this pod from
            # the Service, liveness going false KILLS the container. A liveness probe that depended on
            # the database would turn one RDS blip into a simultaneous crash loop across every replica.
            tcpSocket: { port: 5000 }
            periodSeconds: 20
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp } # gunicorn worker_tmp_dir
      volumes:
        - name: tmp
          emptyDir: {}
