# 1) Default-deny ALL ingress + egress in the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# 2) Allow DNS egress (every pod needs CoreDNS).
# NOTE: no `to:` key here, and do not add one back as `to: []`. An omitted `to` already means "any
# destination" -- the two are identical to Kubernetes, which is why the API server drops the empty
# list on write. It dropping the list is what breaks `helm upgrade`: see the empty-list check in
# scripts/ci/validate-repo.sh for the full mechanism (it cost a failed deploy on 2026-08-10).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
# 3) Frontend: ingress from the ALB (its ENIs live in the VPC) on 8080.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-alb-to-frontend
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app: frontend }
  policyTypes: [Ingress]
  ingress:
    # The ALB's network interfaces, and nothing else. Previously this said 10.0.0.0/16 -- the whole
    # VPC -- which reads as "the load balancer" but is not: the AWS VPC CNI gives every POD a VPC
    # address, so that rule also admitted every pod in the cluster. Both Ingresses are
    # scheme: internet-facing with target-type: ip, so the ALB's interfaces can only ever be in the
    # public subnets, which contain no pods.
    - from:
        {{- range .Values.network.albSubnetCidrs }}
        - ipBlock: { cidr: {{ . | quote }} }
        {{- end }}
      ports:
        - { protocol: TCP, port: 8080 }
---
# Prometheus scraping the application, granted BY NAME rather than inherited from an address range.
# After the narrowing above, this is the only thing that lets the observability namespace in, so the
# grant is deliberate and reviewable.
#
# The three ports are exactly the metrics endpoints: backend /metrics on 5000, worker /metrics on
# 9100, and the frontend's nginx exporter on 9113. Nothing else in this namespace is reachable from
# observability.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [backend, worker, frontend] }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
      ports:
        - { protocol: TCP, port: 5000 }
        - { protocol: TCP, port: 9100 }
        - { protocol: TCP, port: 9113 }
---
# 4) Backend: ingress from frontend only, on 5000.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app: backend }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: frontend } }
      ports:
        - { protocol: TCP, port: 5000 }
---
# 5) EGRESS -- one policy per thing a workload legitimately needs to reach.
#
# This was ONE policy (`allow-app-egress`) until 2026-08-23. It selected all six app labels and then
# allowed the entire VPC and the entire Service CIDR on EVERY port, plus 0.0.0.0/0:443. The Task 3
# review scored it (finding T3-1) and was right to: the RDS security group admits anything coming
# from the node security group, so "the whole VPC on any port" meant the frontend -- the one workload
# the public internet can reach -- could open a connection straight to the database. Nothing in the
# app needed that; it was breadth nobody had gone back and trimmed.
#
# What each workload actually needs was re-derived from the code rather than from the old comment,
# and three of those beliefs turned out to be stale:
#   * the backend imports psycopg2, flask, itsdangerous, werkzeug and prometheus_client, and NOTHING
#     else -- no boto3, no requests, no urllib. It carries no IRSA role. So it needs 5432 and nothing
#     on 443 at all.
#   * nginx.conf has exactly one proxy_pass, `http://backend:5000`. The frontend needs the backend
#     and nothing else -- no AWS, no RDS.
#   * the "OTel collector" justification for opening every VPC port is obsolete: all six pod
#     templates carry the four `instrumentation.opentelemetry.io/inject-*: "false"` annotations, so
#     no collector sidecar is injected into any of them and there is no collector to reach.
#
# NetworkPolicies are ADDITIVE -- a pod matched by two of these gets the union, which is how `worker`
# ends up with both database and AWS access. Splitting them costs an object each and buys the ability
# to say why a grant exists and to remove one without touching the others.
#
# THE FAILURE MODE THIS SPLIT MAKES MORE LIKELY, so read it before adding a workload: a pod whose
# label appears in NONE of these keeps only allow-dns-egress. DNS then resolves perfectly and every
# TCP connection is silently dropped, which looks like an application bug, not a policy gap. The
# backup CronJob shipped exactly that way for 12 days (2026-07-19 to 2026-07-31). Four policies are
# four chances to forget instead of one, so scripts/ci/validate-repo.sh now FAILS THE BUILD when a
# pod template carries an `app:` label that no egress policy here selects. Add the label to a policy
# below; do not add it to the validator's exemption list unless the pod genuinely must not talk to
# anything.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-db-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      # `migrate` is the pre-upgrade schema Job. It needs the same RDS egress as the backend but must
      # NOT carry `app: backend`, which the backend Service selects -- that would route live HTTP to
      # a pod running a one-shot script.
      # `frontend` and `canary` are deliberately absent: neither speaks Postgres, and their absence
      # here is what actually closes finding T3-1.
      - { key: app, operator: In, values: [backend, worker, backup, migrate] }
  policyTypes: [Egress]
  egress:
    - to:
        # RDS lives in the isolated DB subnets inside this CIDR. Port-scoped to 5432, where the old
        # policy allowed every port to every address in the VPC -- including every other pod.
        - ipBlock: { cidr: 10.0.0.0/16 }
      ports:
        - { protocol: TCP, port: 5432 }
---
# frontend -> backend, and nothing else. nginx serves static files and reverse-proxies /api/* to
# `http://backend:5000`; that is the entirety of its outbound traffic.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app: frontend }
  policyTypes: [Egress]
  egress:
    - to:
        # BOTH ranges, on purpose. nginx connects to the backend Service's ClusterIP (172.20.x), and
        # the VPC CNI policy agent evaluates the packet BEFORE kube-proxy DNATs it to the pod IP --
        # so without the Service CIDR the proxy is denied outright. The pod CIDR is listed too
        # because that ordering is an implementation detail of the agent, not a guarantee, and being
        # wrong about it costs a total frontend outage. Both are pinned to 5000, so this is still far
        # narrower than the all-ports rule it replaces.
        - ipBlock: { cidr: 172.20.0.0/16 }
        - ipBlock: { cidr: 10.0.0.0/16 }
      ports:
        - { protocol: TCP, port: 5000 }
---
# worker + backup -> the AWS APIs, via the NAT gateway. worker publishes to SNS and writes S3
# snapshots/ (boto3, services/worker/snapshots.py); backup runs `aws s3 cp` into backups/. Both also
# reach STS on the same port to exchange their IRSA token for credentials.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-aws-api-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchExpressions:
      - { key: app, operator: In, values: [worker, backup] }
  policyTypes: [Egress]
  egress:
    - to:
        # NOT narrowed with `except: [10.0.0.0/16]`, deliberately. The review suggests VPC endpoints
        # "where practical" -- but if S3/SNS/STS interface endpoints are ever added to this VPC, that
        # traffic starts resolving to a VPC address on the same port 443, and an `except` would then
        # break the worker and the backup job at the exact moment someone was trying to IMPROVE the
        # network posture. The meaningful narrowing here is the port and the two-workload selector:
        # frontend, backend, migrate and canary no longer have this rule at all.
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 443 }
---
# canary -> the PUBLIC ALB, the same way a browser reaches it. Separate from the AWS policy above
# rather than merged into a shared selector: the justification is completely different, and a merged
# rule means a future edit for the worker silently changes what the canary may reach.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-canary-egress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels: { app: canary }
  policyTypes: [Egress]
  egress:
    - to:
        # The Ingress is scheme: internet-facing, so `ingress.host` resolves to PUBLIC addresses and
        # this never actually carries in-VPC traffic. It is still written 0.0.0.0/0 rather than
        # `except: [10.0.0.0/16]` for a blunt operational reason: per the root CLAUDE.md, disabling
        # or breaking the canary does not just lose one metric -- it makes voteball:availability
        # ratio5m silently untrustworthy and VoteballJourneyTrafficStopped meaningless, because this
        # site has almost no organic traffic and the canary IS the denominator. A tighter rule that
        # is wrong fails in the direction of "every SLI reads healthy while nothing is measured".
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 443 }
