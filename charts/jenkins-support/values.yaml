# All values are supplied by terraform/addon-jenkins.tf. Defaults here exist so `helm template` runs
# offline for scripts/tests/test-jenkins-chart.sh.
awsRegion: il-central-1
secretName: voteball/jenkins
refreshInterval: 1h

# This VPC's CIDR, used twice in networkpolicy.yaml with OPPOSITE intent: excluded from egress (so CI
# cannot reach RDS or the app) and allowed for ingress (so the ALB's ENIs can health-check the
# controller). Terraform passes the real value; hardcoding it in the template would break a fork.
vpcCidr: 10.0.0.0/16

# The EKS cluster's Service CIDR (NOT the VPC's -- it's a separate, cluster-internal range that the
# Kubernetes API server's ClusterIP lives on). The controller needs egress to it to create/watch/exec
# into agent pods. Like vpcCidr, this is account/cluster-specific and would break a fork if
# hardcoded, so Terraform passes the real value (`aws eks describe-cluster`'s serviceIpv4Cidr); this
# default exists only so `helm template` runs offline.
serviceCidr: 172.20.0.0/16

# The webhook Ingress's ACM cert and hostname. Terraform passes
# aws_acm_certificate_validation.jenkins.certificate_arn and "jenkins.${var.app_domain}" -- account
# and domain specific, so hardcoding either would break a fork. These defaults exist only so `helm
# template` runs offline.
certificateArn: ""
host: ""

# The application namespace the CD agent is allowed to READ. It gets no write verb of any kind --
# every write goes through ArgoCD. Terraform passes the real value; see terraform/addon-jenkins.tf.
appNamespace: devops-app

# The CD agent's IRSA role ARN (ECR read-only on the four app repos). Terraform passes
# module.jenkins_cd_irsa.iam_role_arn; this default exists only so `helm template` runs offline.
cdRoleArn: ""

# ServiceMonitor for the Jenkins controller's /prometheus endpoint (the `prometheus` plugin, added to
# ci/jenkins/plugins.txt). Requires the ServiceMonitor CRD; set false to render offline. Terraform
# passes the real value.
serviceMonitor:
  enabled: true
