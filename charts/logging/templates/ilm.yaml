{{- if and .Values.enabled .Values.ilm.enabled }}
# Index lifecycle: roll over daily or at 1 GB, delete at 7 days.
#
# NOT OPTIONAL. Without it the 20Gi volume fills in roughly 130 days at the measured ingest rate,
# Elasticsearch then flips the index read-only at its flood-stage watermark, and ingestion stops --
# silently, from Fluentd's point of view, which retries forever. Seven days is the retention because
# CloudWatch holds the authoritative copy; Elasticsearch is the SEARCH surface, not the archive
# (spec decision 6b).
#
# Applied by a Job rather than ECK's StackConfigPolicy CRD, which requires an ENTERPRISE licence.
# ILM itself is free under the Basic licence ECK installs by default.
apiVersion: batch/v1
kind: Job
metadata:
  name: logging-ilm-bootstrap
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logging.labels" . | nindent 4 }}
  annotations:
    # post-install AND post-upgrade: the Elasticsearch resource must already exist, and re-running on
    # upgrade is how a changed retention actually reaches the cluster. Every call below is a PUT and
    # is idempotent.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  # The hook must FAIL rather than hang. ArgoCD waits on hook completion, so an unbounded wait
  # for an Elasticsearch that never comes up stalls the whole sync instead of reporting Failed.
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app: logging-ilm-bootstrap
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        # The container's root filesystem is read-only and the only mounted volume is the
        # read-only certs secret, so the emptyDir below needs fsGroup for the uid-1000 process to
        # actually be able to write into it (Task 3 hit this same shape with Fluentd).
        fsGroup: 1000
      containers:
        - name: bootstrap
          image: curlimages/curl:8.11.1
          env:
            - name: ELASTIC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: voteball-logs-es-elastic-user
                  key: elastic
          # BLOCK form, not the inline `{ cpu: ..., memory: ... }` flow map. Task 1's budget
          # parser keys on `requests:` followed by indented cpu:/memory: lines; the inline form
          # would contribute ZERO to the sum, and a budget gate that silently undercounts is
          # worse than no gate at all.
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: certs
              mountPath: /etc/certs
              readOnly: true
            # readOnlyRootFilesystem: true means /tmp is not writable unless something mounts it.
            # Every curl call below writes its response body to /tmp -- proven to fail Task 3's
            # Fluentd the same way, in Docker, before this fix.
            - name: tmp
              mountPath: /tmp
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ES="https://voteball-logs-es-http:9200"
              CA="/etc/certs/ca.crt"

              # Credentials via a config file, never `-u` on the command line: argv is world-
              # readable through /proc/<pid>/cmdline, the same defect shape as the live ECR token
              # this repo leaked on 2026-08-04 via `set -x`. `printf` is a SHELL BUILTIN in this
              # image's /bin/sh (BusyBox ash), so it forks no process and the password never
              # appears in any argv at all -- writing it with an external command would just move
              # the leak.
              umask 077
              printf 'user = "elastic:%s"\n' "$ELASTIC_PASSWORD" > /tmp/curlrc

              # Wait for Elasticsearch to answer. The hook ordering guarantees the RESOURCE exists,
              # not that the pod is serving; a fresh cluster takes ~60s to come up.
              #
              # Bounded on purpose. `backoffLimit` counts container EXITS, so an infinite loop is
              # invisible to it -- the container simply never exits. ArgoCD waits on hook
              # completion, so an unbounded wait here stalls the whole sync instead of reporting
              # Failed -- worse than a fast failure, since this repo's CD design depends on
              # failures being loud.
              deadline=$(( $(date +%s) + 540 ))
              until curl -sf --cacert "$CA" -K /tmp/curlrc "$ES/_cluster/health" >/dev/null; do
                if [ "$(date +%s)" -ge "$deadline" ]; then
                  echo "Elasticsearch did not become ready within 540s" >&2
                  exit 1
                fi
                echo "waiting for Elasticsearch..."
                sleep 5
              done

              # -f makes curl exit non-zero on a 4xx/5xx, so a rejected policy FAILS the Job rather
              # than printing an error body and reporting success. This is the swallowed-exit-status
              # shape CLAUDE.md warns about; -f is what closes it.
              echo "applying ILM policy voteball-logs-7d"
              curl -sf --cacert "$CA" -K /tmp/curlrc -X PUT "$ES/_ilm/policy/voteball-logs-7d" \
                -H 'Content-Type: application/json' -d '{
                  "policy": {
                    "phases": {
                      "hot": {
                        "actions": {
                          "rollover": {
                            "max_age": "1d",
                            "max_primary_shard_size": {{ .Values.ilm.rolloverMaxSize | quote }}
                          }
                        }
                      },
                      "delete": {
                        "min_age": "{{ .Values.ilm.retentionDays }}d",
                        "actions": { "delete": {} }
                      }
                    }
                  }
                }'

              echo "applying index template voteball-logs"
              curl -sf --cacert "$CA" -K /tmp/curlrc -X PUT "$ES/_index_template/voteball-logs" \
                -H 'Content-Type: application/json' -d '{
                  "index_patterns": ["voteball-logs-*"],
                  "template": {
                    "settings": {
                      "number_of_shards": 1,
                      "number_of_replicas": 0,
                      "index.lifecycle.name": "voteball-logs-7d",
                      "index.lifecycle.rollover_alias": "voteball-logs"
                    }
                  }
                }'

              # Bootstrap the first backing index and point the write alias at it. Without this,
              # Fluentd's first write auto-creates a plain index that ILM never manages.
              # 400 == already exists, which is the normal case on upgrade -- so this one call is
              # deliberately NOT -f, and its status is inspected instead.
              # CLEAR A CONCRETE INDEX SQUATTING ON THE ALIAS NAME, if there is one.
              #
              # This Job is a post-install hook, which ArgoCD maps to PostSync -- so it runs AFTER
              # the Fluentd Deployment, not before it. Fluentd therefore wins the race on a fresh
              # install: its first write auto-creates a plain INDEX named `voteball-logs`, and
              # Elasticsearch then refuses the alias with
              #   invalid_alias_name_exception: an index or data stream exists with the same name
              # leaving every log unmanaged by ILM and the Job failing its whole backoffLimit.
              # Observed on the first real deploy, 2026-08-28.
              #
              # Deleting it is safe and is the reason retention is only 7 days here: CloudWatch has
              # the authoritative copy of every one of these records (Fluent Bit fans out to both),
              # so what is discarded is a few minutes of a SEARCH INDEX, never the logs themselves.
              # The count is printed rather than swallowed, so the cost is visible in the Job log.
              if curl -sf --cacert "$CA" -K /tmp/curlrc -o /dev/null \
                   "$ES/voteball-logs/_alias/voteball-logs"; then
                echo "alias voteball-logs already exists -- nothing to clear"
              elif curl -sf --cacert "$CA" -K /tmp/curlrc -o /tmp/squat \
                   "$ES/_cat/indices/voteball-logs?h=index,docs.count" 2>/dev/null && [ -s /tmp/squat ]; then
                echo "WARNING: a concrete index is squatting on the alias name -- Fluentd started"
                echo "         before this Job ran. Deleting it; CloudWatch keeps these records."
                echo "         discarding: $(cat /tmp/squat)"
                curl -sf --cacert "$CA" -K /tmp/curlrc -X DELETE "$ES/voteball-logs" >/dev/null \
                  || { echo "could not delete the squatting index" >&2; exit 1; }
              fi

              echo "bootstrapping write alias"
              code="$(curl -s -o /tmp/out -w '%{http_code}' --cacert "$CA" -K /tmp/curlrc \
                -X PUT "$ES/%3Cvoteball-logs-000001%3E" \
                -H 'Content-Type: application/json' -d '{
                  "aliases": { "voteball-logs": { "is_write_index": true } }
                }')"
              case "$code" in
                200|201) echo "alias bootstrapped" ;;
                400)     grep -q 'resource_already_exists' /tmp/out && echo "alias already exists" || { cat /tmp/out; exit 1; } ;;
                *)       cat /tmp/out; exit 1 ;;
              esac

              echo "ILM bootstrap complete"
      volumes:
        - name: certs
          secret:
            secretName: voteball-logs-es-http-certs-public
        - name: tmp
          emptyDir: {}
{{- end }}
