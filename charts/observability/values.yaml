# Everything in this chart is gated, so `helm template` works against a cluster with no
# kube-prometheus-stack CRDs installed -- the same escape hatch charts/voteball's alerts.enabled
# provides, and for the same reason: `helm template` succeeds either way, but `helm install` fails on
# an unknown kind.

# Grafana dashboards, shipped as ConfigMaps the Grafana sidecar discovers by label.
dashboards:
  enabled: true

# Platform alert rules (Kubernetes, Jenkins, the monitoring system itself). Application rules live in
# charts/voteball, next to the application they describe.
alerts:
  enabled: true

# NetworkPolicies for this namespace. See templates/networkpolicy.yaml -- the EGRESS list is the
# dangerous half.
networkPolicy:
  enabled: true

# The two PUBLIC subnet CIDRs, matching charts/voteball. Only used if a policy ever needs to admit the
# load balancer; kept here so both charts state the fact the same way.
network:
  albSubnetCidrs:
    - "10.0.0.0/20"
    - "10.0.16.0/20"

# The EKS Service CIDR -- NOT the VPC's. A separate, cluster-internal range the API server's
# ClusterIP lives on (confirmed live: `kubectl get svc kubernetes -n default -o
# jsonpath='{.spec.clusterIP}'` -> 172.20.0.1, inside this /16). Account- and cluster-specific, and
# stated here as a literal because this chart is ArgoCD-synced and cannot receive a Terraform output.
serviceCidr: "172.20.0.0/16"

# The Jenkins queue-length metric name. The prometheus plugin prefixes its metrics with a configurable
# namespace, and the Metrics-plugin registry exposes a second, differently-scoped family -- verified
# live against this cluster on 2026-08-18 (see Task 1 Step 8): default_jenkins_executors_queue_length
# exists in the namespaced family, jenkins_queue_size_value in the Metrics-plugin family, and the
# plan's original guess (default_jenkins_queue_size_value) exists under neither. This uses
# jenkins_queue_size_value -- it states the alert's intent directly, and its siblings
# (jenkins_queue_{blocked,buildable,pending,stuck}_value) give a natural escalation path later.
jenkins:
  queueMetric: "jenkins_queue_size_value"
