apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Release.Namespace }}
  labels:
    app: frontend
    {{- include "voteball.labels" . | nindent 4 }}
spec:
  type: ClusterIP # the ALB Ingress (Plan 3b) fronts this; no direct LoadBalancer
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
