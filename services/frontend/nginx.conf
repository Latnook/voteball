# EKS: ALB terminates TLS and forwards plain HTTP here on 8080. No 80->443 redirect (the ALB does
# HTTP->HTTPS), no ssl_certificate. nginx-unprivileged listens on 8080 as uid 101.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    # Absolute URLs for SEO (canonical, og:url, og:image, the Sitemap: line in robots.txt, and the
    # sitemap's own <loc> entries) are written as the literal __SITE_URL__ and rewritten here from
    # the request's own Host header. The domain is therefore hardcoded nowhere in the repo, per the
    # forkability rule in CLAUDE.md -- a rebuild onto a new domain needs no code change.
    #
    # Scheme is fixed to https because the ALB redirects :80 -> :443 before anything reaches this
    # pod, so $scheme (always "http" here, TLS having been terminated upstream) would be wrong.
    #
    # application/json is deliberately NOT in the types list: /api/ responses must never be rewritten.
    sub_filter_types text/xml application/xml text/plain;
    sub_filter __SITE_URL__ "https://$host";
    sub_filter_once off;

    # Serve "/" directly (no `index` directive) so it can't rewrite to /index.html and loop.
    location = / {
        try_files /index.html =404;
    }

    location = /index.html { return 301 /; }
    location = /results.html { return 301 /results; }
    location = /admin.html { return 301 /admin; }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # In-cluster DNS: "backend" resolves to the backend Service in the same namespace.
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
