image:
  # All values marked FILLED-BY-SYNC are written by scripts/sync-values-from-tf.sh from Terraform
  # outputs on every deploy. Do not hand-edit them; they change whenever the stack is rebuilt.
  registry: "590183895228.dkr.ecr.il-central-1.amazonaws.com"
  tag: "962f657"
  pullPolicy: IfNotPresent

# The two PUBLIC subnet CIDRs from terraform/vpc.tf. Used by the frontend ingress policy to admit the
# ALB's network interfaces and nothing else.
#
# These are not sync-managed and change only if someone edits terraform/vpc.tf's `public_subnets`.
# A mismatch fails loudly and immediately -- the ALB's health checks are dropped and the target group
# goes unhealthy -- rather than silently.
network:
  albSubnetCidrs:
    - "10.0.0.0/20"
    - "10.0.16.0/20"

# Non-secret config -> ConfigMap app-config. DB_HOST is the Plan-3a RDS endpoint (set in Task 1/7).
config:
  DB_HOST: "voteball-eks-db.cfew0a2ywspq.il-central-1.rds.amazonaws.com"
  DB_NAME: "postgres"
  DB_USER: "postgres"
  DB_SSLMODE: "require"
  AWS_REGION: "il-central-1" # matches aws_region in your tfvars
  SNS_TOPIC: "arn:aws:sns:il-central-1:590183895228:voteball-notifications"
  S3_BUCKET: "voteball-rollups-590183895228"
  S3_SNAPSHOT_PREFIX: "snapshots"

# ESO ExternalSecret: pulls voteball/app-secret from Secrets Manager into K8s Secret app-secret.
externalSecret:
  secretName: "voteball/app-secret"
  refreshInterval: "1h"

ingress:
  host: "voteball.latnook.com"
  certificateArn: "arn:aws:acm:il-central-1:590183895228:certificate/0b5fb4c4-0615-426f-a130-95ba95347e75"
  wafAclArn: "arn:aws:wafv2:il-central-1:590183895228:regional/webacl/voteball-alb/d97f3632-f805-4ec3-bbb4-9fbdc913cfa6"

# Alert rules (charts/voteball/templates/prometheusrule.yaml). Requires kube-prometheus-stack's
# PrometheusRule CRD, which terraform/addon-monitoring.tf installs. Set false to render the chart
# against a cluster without it -- `helm template` succeeds either way, but `helm install` fails on
# an unknown kind.
alerts:
  enabled: true

# ServiceMonitors (charts/voteball/templates/servicemonitor.yaml). Requires kube-prometheus-stack's
# ServiceMonitor CRD, which terraform/addon-monitoring.tf installs. Set false to render the chart
# against a cluster without it -- `helm template` succeeds either way, but `helm install` fails on an
# unknown kind. Same escape hatch, same reason, as alerts.enabled above.
serviceMonitors:
  enabled: true

backup:
  roleArn: "arn:aws:iam::590183895228:role/voteball-backup-irsa"
  schedule: "0 2 * * *"

backend:
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

frontend:
  replicas: 2
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 64Mi
  # nginx metrics sidecar. Reads nginx's built-in stub_status over loopback and re-exposes it in
  # Prometheus format on 9113. Pinned by tag like every other image here -- validate-repo.sh fails
  # the build on an unpinned one.
  # CPU limit doubled 2026-08-18: CPUThrottlingHigh measured this container at ~6-9% throttled
  # periods even though average usage is tiny (~0.2m core) -- the Prometheus scrape hits stub_status
  # in a short burst rather than a steady drip, so it needs headroom above its average, not above its
  # request. Request is untouched -- average usage doesn't justify reserving more scheduling budget.
  exporter:
    image: "nginx/nginx-prometheus-exporter:1.5.3"
    resources:
      requests: { cpu: 10m, memory: 16Mi }
      limits: { cpu: 100m, memory: 32Mi }

worker:
  # Singleton poller, not a request-serving tier — 2 replicas would just be
  # 2 processes independently polling and computing identical rollups.
  replicas: 1
  roleArn: "arn:aws:iam::590183895228:role/voteball-worker-irsa"
  # CPU limit doubled 2026-08-18: CPUThrottlingHigh measured ~8% throttled periods here too, from the
  # bursty rollups.recompute() triggered by NOTIFY votes_changed -- a wholesale rebuild of all eight
  # rollup tables in one shot, not steady load. Average usage (~1.6m core) stayed far under even the
  # old 100m limit, so the request is untouched; only the burst ceiling needed raising.
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Synthetic canary (charts/voteball/templates/canary-deployment.yaml). Continuously exercises the
# real public journey (ALB -> nginx -> backend -> RDS) so voteball:journey_requests:rate5m is never
# zero -- this site has almost no organic traffic, so "zero requests" is its normal state, and every
# SLI/alert built on a bad/total RATIO is blind whenever both go to zero together. That blind spot is
# what let the 2026-08-18 RDS-egress drill render as a perfect green dashboard.
#
# Setting this false removes the only thing guaranteeing traffic -- VoteballJourneyTrafficStopped in
# prometheusrule.yaml is gated on this same flag for exactly that reason; disable them together.
canary:
  enabled: true
  # Pinned by tag like every other image in this chart -- validate-repo.sh only checks
  # services/*/Dockerfile, but the same "no floating tag" rule applies here by convention.
  image: "curlimages/curl:8.7.1"
  intervalSeconds: 30
  # RAISED AGAIN 20m -> 150m -> 500m the same day, after measuring: at 150m the container was STILL
  # throttled 72.8% of periods while using 0.0055 cores on average and peaking at 0.0091. That is not
  # a contradiction, it is how CFS works -- a limit is a quota PER 100ms PERIOD, and 150m grants 15ms
  # of it. One curl (DNS + TLS handshake + HTTP) bursts well past 15ms inside a single period, so
  # every burst is throttled even though average usage is negligible. The cost was observable:
  # journey_requests:rate5m sat at 0.0667/s against an intended 0.1/s -- throttling was suppressing a
  # third of the traffic the ratio-based SLIs depend on.
  # A limit is KEPT rather than removed (the usual advice for bursty workloads) because the course
  # brief requires requests AND limits on every container. 500m reserves nothing -- limits cap, they
  # do not reserve -- and the 15m REQUEST is what actually affects scheduling.
  # CPU limit raised 7.5x (20m -> 150m) 2026-08-18: CPUThrottlingHigh caught this container at 97.6%
  # throttled periods (1289/1321 CFS periods over 10m) -- confirmed live via
  # container_cpu_cfs_throttled_periods_total/container_cpu_cfs_periods_total in Prometheus. The old
  # 20m limit is a 2ms compute quota per 100ms CFS period; three sequential curl invocations (DNS +
  # TLS handshake + HTTP, three times) blow well past that in a single burst even though the 10m
  # *average* usage is only ~4.4m core -- CFS throttles on the instantaneous burst, not the average,
  # so a low average is not proof of a safe limit for spiky workloads like this one. Left throttled,
  # the loop barely executes its 30s cycle, which thins voteball:journey_requests:rate5m -- the only
  # thing keeping the ratio-based SLIs' denominator non-zero -- and pushes
  # scripts/ci/monitoring-gate.sh's GATE_MIN_SAMPLES=20 floor closer to warn-and-pass. Request raised
  # only 5m -> 15m (still trivial against the 2-node t3.large budget); it's the limit, not the
  # request, that was starving it.
  resources:
    requests: { cpu: 15m, memory: 16Mi }
    limits: { cpu: 500m, memory: 32Mi }
