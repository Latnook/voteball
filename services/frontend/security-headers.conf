# Browser-hardening headers for every response the frontend serves.
#
# INCLUDED TWICE ON PURPOSE -- once at server level and once inside `location /api/`. nginx's
# add_header is NOT inherited into any block that declares an add_header of its own, and /api/
# declares X-Robots-Tag; without the second include, every API response would silently carry none
# of these. scripts/tests/test-hardening.sh asserts the include in every location that has an
# add_header, so the next such location fails the build rather than the browser.
#
# `always` puts them on 4xx/5xx responses too.
#
# Content-Security-Policy is deliberately strict -- no 'unsafe-inline' anywhere -- and it holds
# only because the pages are built for it: no inline <script>, no inline <style>, no style="" or
# on*="" attributes, every asset self-hosted. The one exception is img-src https:, because
# seed.sql's logo_url values are hotlinked from ~300 origins (services/frontend/CLAUDE.md records
# why that is tolerated and where it is not). JSON-LD <script type="application/ld+json"> blocks
# are data, not code, and CSP does not evaluate them. Setting element.style.x from JS is CSSOM and
# allowed; setAttribute('style', ...) and <style> elements are not. Adding either breaks the page
# silently in production -- see the test.
#
# HSTS carries no `preload`: that directive is a request to join a browser-shipped list that is
# near-impossible to leave, and on a subdomain it does nothing unless the apex opts in too.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
