# EFK logging. See docs/design/2026-08-27-efk-logging-design.md.
#
# `enabled` is the master gate and ships TRUE. The DEPLOY ORDERING is what makes that safe, and it is
# the same precedent CLAUDE.md already records for the Grafana datasource gates -- "the gates ship
# `true` because the seed step makes that safe":
#
#   * Every object in this chart is a custom resource whose CRD is installed by `terraform apply`
#     (terraform/addon-eck.tf), which is deploy step 6.
#   * The `logging` ArgoCD Application that syncs this chart is not created until deploy step 11.
#
# So on a fresh cluster the CRDs always exist before anything here is ever handed to the API server,
# and on an existing cluster there is NO `logging` Application at all until a deploy that ran both
# halves -- a git push on its own cannot reach the cluster ahead of the apply. That is what removes
# the 2026-08-24 failure mode (consumer pushed before its Terraform-created dependency exists: ArgoCD
# cannot resolve the kind, the sync reports phase: Failed, and application-cd rolls production back).
#
# NOTHING FLIPS THIS FIELD. `scripts/deploy.sh` step 11e VERIFIES the pipeline end to end
# (scripts/logging/verify-efk.sh); it does not enable it, and no ArgoCD `helm.parameters` override it.
# Shipping `false` here would be the 2026-08-25 corollary in reverse -- a gate that is off in git with
# nothing to turn it on is a rebuild that renders zero objects while ArgoCD reports Synced/Healthy on
# an empty manifest and the deploy reports success.
#
# Set it to false only to take the whole stack down deliberately; `helm template` and
# scripts/tests/test-logging-chart.sh exercise that kill-switch path with --set enabled=false.
enabled: true

# Elasticsearch. One node, no replica -- cluster health is YELLOW BY DESIGN and nothing should alert
# on it (spec decision 3 and 9).
elasticsearch:
  version: "9.1.4"
  # 1 GiB heap inside a 2 GiB container: Elasticsearch wants roughly half the container for heap and
  # half for the filesystem cache. Sized from the MEASURED ~150 MB/day that reaches devops-app, not
  # from the vendor default -- see spec decision 3 for the arithmetic and why it removes a node.
  heapSize: "1g"
  storage:
    size: "20Gi"
    storageClassName: "gp3"
  resources:
    requests: { cpu: "300m", memory: "2Gi" }
    limits:   { cpu: "1",    memory: "2Gi" }

# Kibana. Its self-signed TLS is disabled because the ALB terminates real ACM TLS in front of it --
# the same reason services/frontend runs plain nginx on :8080.
kibana:
  version: "9.1.4"
  resources:
    requests: { cpu: "200m", memory: "1Gi" }
    limits:   { cpu: "500m", memory: "1Gi" }
  ingress:
    enabled: true
    # Rewritten per-cluster. Unlike charts/voteball's ten sync-managed fields, this one is NOT
    # written by scripts/sync-values-from-tf.sh -- update it by hand on a rebuild, the same way
    # charts/observability's datasources.postgres.host is handled.
    host: "kibana.voteball.latnook.com"
    # DELIBERATELY EMPTY -- and it needs a certificate to exist anyway. With no `certificate-arn`
    # annotation the AWS Load Balancer Controller falls back to HOST-BASED DISCOVERY and looks up an
    # ISSUED ACM certificate matching the host above. terraform/addon-eck.tf creates exactly that
    # certificate (aws_acm_certificate.kibana), so discovery succeeds and no eleventh sync-managed
    # field is introduced. Do NOT read "empty" as "TLS is optional here": this Ingress joins a GROUP,
    # and a member whose certificate cannot be resolved fails the whole group's model build --
    # stalling the ALB that also serves the public site and the Jenkins webhook.
    certificateArn: ""
    # MUST match charts/voteball and ci/jenkins-webhook. A grouped ALB de-provisions only when NO
    # member Ingress remains; a different group here would leave a second ALB billing after teardown.
    group: "voteball"

# Fluentd aggregator. Fluent Bit (the DaemonSet in amazon-cloudwatch, unchanged) forwards to this.
fluentd:
  image: "fluent/fluentd-kubernetes-daemonset:v1.18.0-debian-elasticsearch8-1.0"
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }

# Index lifecycle. 7 days, because CloudWatch holds the authoritative copy -- Elasticsearch is the
# SEARCH surface, not the archive (spec decision 6b).
ilm:
  enabled: true
  retentionDays: 7
  rolloverMaxSize: "1gb"

networkPolicy:
  enabled: true
