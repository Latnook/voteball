# SecretStore: ESO talks to Secrets Manager using the ESO controller's IRSA (scoped to this secret
# in Plan 2b). ExternalSecret materializes the K8s Secret app-secret that backend/worker envFrom.
# apiVersion v1: ESO 2.8.0 serves external-secrets.io/v1 (v1beta1 is no longer served).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.config.AWS_REGION | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: app-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: app-secret        # the K8s Secret backend/worker read via envFrom
    creationPolicy: Owner
    deletionPolicy: Retain  # ESO default -- stated explicitly so ArgoCD stays Synced (no controller drift)
  dataFrom:
    - extract:
        key: {{ .Values.externalSecret.secretName | quote }}
        # ESO defaults -- pinned so ArgoCD's rendered manifest matches the live (defaulted) resource.
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
---
# The grafana_ro Postgres password, for the migrate Job's ALTER ROLE (services/backend/migrate.py).
#
# A SEPARATE ExternalSecret rather than another key in app-secret: this namespace has no business
# holding the GitHub token that sits in the same Secrets Manager container, and `data` with a named
# property is what keeps the two apart. Kept out of app-secret so backend/worker do not gain a
# credential they never use.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-db-secret
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    name: aws-secrets
    kind: SecretStore
  target:
    name: grafana-db-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: GRAFANA_DB_PASSWORD
      remoteRef:
        key: {{ .Values.externalSecret.grafanaSecretName | quote }}
        property: db_password
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None
